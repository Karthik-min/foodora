name: Foodora CI/CD

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend
        run: docker build -t karthik2712/foodora-backend:latest ./backend

      - name: Build Frontend
        run: docker build -t karthik2712/foodora-frontend:latest ./frontend

      - name: Push Backend
        run: docker push karthik2712/foodora-backend:latest

      - name: Push Frontend
        run: docker push karthik2712/foodora-frontend:latest