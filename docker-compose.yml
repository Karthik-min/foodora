version: '3.9'

services:
  mongo:
    image: mongo:6.0
    container_name: food-delivery-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  backend:
    build:
      context: ./backend
    container_name: food-delivery-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongo:27017/food_delivery
      - JWT_SECRET=your_jwt_secret_key_change_in_production
      - NODE_ENV=production
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=http://localhost:5000/api
    container_name: food-delivery-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
    name: food_delivery_mongo_data
